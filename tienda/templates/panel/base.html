{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block titulo %}Panel{% endblock %} · SuperMotos La 4ta</title>
<style>
  /* Mismos tokens de marca que web_frontend.html (IBM Plex, rojo Honda). Es
     un documento aparte (panel server-rendered, no la SPA del sitio), así
     que los @font-face se repiten acá apuntando a los mismos archivos --no
     se duplica ningún archivo de fuente, solo estas pocas líneas de CSS. */
  @font-face{font-family:'IBM Plex Sans';src:url('{% static "fonts/ibm-plex-sans-latin-400-normal.woff2" %}') format('woff2');font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:'IBM Plex Sans';src:url('{% static "fonts/ibm-plex-sans-latin-500-normal.woff2" %}') format('woff2');font-weight:500;font-style:normal;font-display:swap}
  @font-face{font-family:'IBM Plex Sans';src:url('{% static "fonts/ibm-plex-sans-latin-600-normal.woff2" %}') format('woff2');font-weight:600;font-style:normal;font-display:swap}
  @font-face{font-family:'IBM Plex Sans';src:url('{% static "fonts/ibm-plex-sans-latin-700-normal.woff2" %}') format('woff2');font-weight:700;font-style:normal;font-display:swap}
  @font-face{font-family:'IBM Plex Mono';src:url('{% static "fonts/ibm-plex-mono-latin-500-normal.woff2" %}') format('woff2');font-weight:500;font-style:normal;font-display:swap}
  :root{
    --rojo:#E30613; --rojo-osc:#B00510; --negro:#17181C; --gris:#6B7078;
    --gris-claro:#9CA0A8; --humo:#F4F4F6; --linea:#E6E7EA; --blanco:#FFFFFF;
    --verde:#0a7d43; --ambar:#B8860B;
    --font-sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --radio:12px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:var(--font-sans);color:var(--negro);background:var(--humo);
       font-size:15px;line-height:1.45;padding-bottom:32px}
  h1,h2{font-family:var(--font-sans);text-transform:uppercase}
  button, input, select{font-family:inherit;font-size:inherit}
  a{color:inherit}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}
  @media(min-width:760px){.wrap{max-width:760px}}

  header.pnl{
    background:var(--negro);color:#fff;padding:14px;
  }
  header.pnl .fila{display:flex;align-items:center;justify-content:space-between;max-width:560px;margin:0 auto}
  @media(min-width:760px){header.pnl .fila{max-width:760px}}
  header.pnl .marca{font-weight:700;font-size:15px;letter-spacing:.02em;text-transform:uppercase}
  header.pnl .marca em{color:var(--rojo);font-style:normal}
  header.pnl .usuario{font-size:12.5px;color:#c9ccd3;display:flex;align-items:center;gap:10px}
  header.pnl .usuario button{background:none;border:none;color:#c9ccd3;text-decoration:underline;
    cursor:pointer;padding:0;font-size:12.5px}

  nav.tabs{display:flex;gap:6px;padding:10px 14px 0;max-width:560px;margin:0 auto}
  @media(min-width:760px){nav.tabs{max-width:760px}}
  nav.tabs a{
    flex:1;text-align:center;padding:10px 6px;border-radius:9px 9px 0 0;
    background:var(--linea);color:var(--gris);font-weight:600;font-size:13px;
    text-decoration:none;letter-spacing:.02em;text-transform:uppercase;
  }
  nav.tabs a.activo{background:var(--blanco);color:var(--negro)}

  main.pnl{background:var(--blanco);border-top:3px solid var(--rojo)}

  .mensajes{max-width:560px;margin:12px auto 0;padding:0 14px}
  @media(min-width:760px){.mensajes{max-width:760px}}
  .msg-flash{
    padding:10px 13px;border-radius:9px;font-size:13.5px;font-weight:600;margin-bottom:8px;
  }
  .msg-flash.success{background:#e4f3ea;color:var(--verde)}
  .msg-flash.warning{background:#fdf0dd;color:var(--ambar)}
  .msg-flash.error{background:#fbe4e4;color:var(--rojo-osc)}
  .msg-flash.info{background:#e8eef7;color:#2a5ba8}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:none;border-radius:8px;padding:11px 14px;font-weight:700;font-size:13.5px;
    letter-spacing:.02em;text-transform:uppercase;cursor:pointer;text-decoration:none;
    transition:background .12s;
  }
  .btn-rojo{background:var(--rojo);color:#fff}
  .btn-rojo:hover{background:var(--rojo-osc)}
  .btn-negro{background:var(--negro);color:#fff}
  .btn-negro:hover{background:#000}
  .btn-verde{background:var(--verde);color:#fff}
  .btn-verde:hover{background:#086536}
  .btn-linea{background:transparent;color:var(--negro);border:1.5px solid var(--linea)}
  .btn-linea:hover{border-color:var(--gris-claro)}
  .btn-wa{background:#075E54;color:#fff}
  .btn-wa:hover{background:#0a6e5f}
  .btn-chico{padding:8px 11px;font-size:12px}
  form.inline{display:inline}
</style>
{% block estilos %}{% endblock %}
</head>
<body>
{% block cuerpo %}{% endblock %}
</body>
</html>
