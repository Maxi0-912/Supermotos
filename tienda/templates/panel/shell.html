{% extends "panel/base.html" %}
{% block cuerpo %}
<header class="pnl">
  <div class="fila">
    <div class="marca">Super<em>Motos</em> Panel</div>
    <div class="usuario">
      Hola, {{ nombre_vendedor }}
      <form action="{% url 'panel_logout' %}" method="post" class="inline">
        {% csrf_token %}
        <button type="submit">Salir</button>
      </form>
    </div>
  </div>
</header>
<nav class="tabs">
  <a href="{% url 'panel_cola' %}" class="{% if seccion == 'cola' %}activo{% endif %}">Cola</a>
  {% if request.user.is_superuser %}
  <a href="{% url 'panel_resumen' %}" class="{% if seccion == 'resumen' %}activo{% endif %}">Resumen</a>
  {% endif %}
</nav>
<main class="pnl">
  {% if messages %}
  <div class="mensajes">
    {% for m in messages %}<div class="msg-flash {{ m.tags }}">{{ m }}</div>{% endfor %}
  </div>
  {% endif %}
  {% block contenido %}{% endblock %}
</main>
{% endblock %}
